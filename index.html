
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>私のプロフィール</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f7fb;
      color: #333;
      line-height: 1.8;
    }

    header {
      background: #344b70;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      margin-bottom: 5px;
      font-size: 2.2rem;
    }

    main {
      max-width: 720px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      margin-bottom: 20px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000a;
    }

    h2 {
      color: #344b70;
      border-bottom: 2px solid #e3eaf5;
      padding-bottom: 8px;
    }

    a {
      color: #2865b5;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
    }
  </style>
</head>

<body>
  <header>
    <h1>こんにちは！</h1>
    <p>私のホームページへようこそ</p>
  </header>

  <main>
    <section>
      <h2>プロフィール</h2>
      <p>はじめまして。私のホームページをご覧いただきありがとうございます。</p>
      <p>ここでは、私のことや好きなことを紹介します。</p>
    </section>

    <section>
      <h2>趣味</h2>
      <ul>
        <li>旅行</li>
        <li>写真撮影</li>
        <li>音楽鑑賞</li>
      </ul>
    </section>

    <section>
      <h2>このサイトについて</h2>
      <p>HTMLとCSSを使って作成した個人ホームページです。</p>
    </section>

    <section>
      <h2>リンク</h2>
      <p><a href="https://github.com/">GitHub</a></p>
    </section>
  </main>

  <footer>
    <p>© 2026 My Homepage</p>
  </footer>
</body>
</html>
